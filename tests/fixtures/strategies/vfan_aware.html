<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Verified Fan — Strategy Test Fixture</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; }
    [data-bdd='quick-picks-list'] { list-style: none; padding: 0; margin: 0; }
    [data-bdd='quick-pick-row'] {
      display: block;
      padding: 12px 16px;
      margin: 6px 0;
      border: 1px solid #ccc;
      cursor: pointer;
      user-select: none;
    }
    .vfan-form { margin: 8px 0 24px 0; padding: 10px; background: #eef5ff; }
    .vfan-form input { padding: 6px 8px; width: 240px; }
    .vfan-form button { padding: 6px 12px; margin-left: 8px; }
    .vfan-result { margin-top: 8px; color: #06c; font-size: 0.9em; }
  </style>
</head>
<body>
  <main role="main">
    <h1 data-bdd="event-title">Test Event — Verified Fan Gate</h1>

    <section class="vfan-form">
      <label for="vfan">Enter your Verified Fan code:</label>
      <input
        id="vfan"
        type="text"
        data-bdd="vfan-code"
        placeholder="ABCD-1234"
        aria-label="Verified Fan code"
      >
      <button type="button" data-bdd="vfan-submit">Submit Code</button>
      <div class="vfan-result" data-bdd="vfan-result"></div>
    </section>

    <ul data-bdd="quick-picks-list">
      <li data-bdd="quick-pick-row" data-price-level-id="PL1" data-idx="0">
        Section 100 Row A — $200.00 each
      </li>
      <li data-bdd="quick-pick-row" data-price-level-id="PL2" data-idx="1">
        Section 200 Row B — $90.00 each
      </li>
      <li data-bdd="quick-pick-row" data-price-level-id="PL3" data-idx="2">
        Section 300 Row C — $1,500.00 each
      </li>
    </ul>
  </main>

  <script>
    // Click recorder so tests can assert "row N was clicked exactly once".
    window.__clicks = [];
    document.addEventListener('click', function (event) {
      var row = event.target.closest('[data-bdd="quick-pick-row"]');
      if (!row) return;
      var idx = row.getAttribute('data-idx');
      window.__clicks.push(idx);
      var prev = parseInt(row.getAttribute('data-click-count') || '0', 10);
      row.setAttribute('data-click-count', String(prev + 1));
    }, true);

    // VFan submit recorder. Tests can inspect window.__vfan_submits to
    // confirm the strategy clicked the submit button (and only after the
    // input was filled).
    window.__vfan_submits = [];
    document
      .querySelector('[data-bdd="vfan-submit"]')
      .addEventListener('click', function () {
        var value = document.querySelector('[data-bdd="vfan-code"]').value;
        window.__vfan_submits.push(value);
        document.querySelector('[data-bdd="vfan-result"]').textContent =
          'Submitted code: ' + value;
      });
  </script>
</body>
</html>
