<html lang="en">

  <title>Interactive Seatmap (in iframe) — Strategy Test Fixture</title>

    body { font-family: sans-serif; margin: 0; padding: 16px; }
    iframe { width: 360px; height: 360px; border: 1px solid #999; }

  <main role="main">
    <h1 data-bdd="event-title">Test Event — Seat Map (iframed)</h1>

            src="seatmap_svg.html"></iframe>
  </main>
</body>
