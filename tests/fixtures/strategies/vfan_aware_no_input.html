<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Verified Fan (no input) — Strategy Test Fixture</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; }
    [data-bdd='quick-picks-list'] { list-style: none; padding: 0; margin: 0; }
    [data-bdd='quick-pick-row'] {
      display: block;
      padding: 12px 16px;
      margin: 6px 0;
      border: 1px solid #ccc;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>
  <main role="main">
    <h1 data-bdd="event-title">Test Event — No VFan Gate</h1>

    <!-- Intentionally no [data-bdd='vfan-code'] input on this page.
         VFanAwareStrategy must log a warning and still allow the
         inner strategy to run. -->
    <ul data-bdd="quick-picks-list">
      <li data-bdd="quick-pick-row" data-price-level-id="PL1" data-idx="0">
        Section 100 Row A — $200.00 each
      </li>
      <li data-bdd="quick-pick-row" data-price-level-id="PL2" data-idx="1">
        Section 200 Row B — $90.00 each
      </li>
    </ul>
  </main>

  <script>
    window.__clicks = [];
    document.addEventListener('click', function (event) {
      var row = event.target.closest('[data-bdd="quick-pick-row"]');
      if (!row) return;
      var idx = row.getAttribute('data-idx');
      window.__clicks.push(idx);
      var prev = parseInt(row.getAttribute('data-click-count') || '0', 10);
      row.setAttribute('data-click-count', String(prev + 1));
    }, true);
  </script>
</body>
</html>
