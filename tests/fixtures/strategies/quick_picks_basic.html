<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quick Picks — Event Test Fixture</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; }
    [data-bdd='quick-picks-list'] { list-style: none; padding: 0; margin: 0; }
    [data-bdd='quick-pick-row'] {
      display: block;
      padding: 12px 16px;
      margin: 6px 0;
      border: 1px solid #ccc;
      cursor: pointer;
      user-select: none;
    }
    [data-bdd='order-summary'] { margin-top: 24px; padding: 8px; background: #f5f5f5; }
  </style>
</head>
<body>
  <main role="main">
    <h1 data-bdd="event-title">Test Event — Live Tickets</h1>

    <ul data-bdd="quick-picks-list">
      <li data-bdd="quick-pick-row" data-price-level-id="PL1" data-idx="0">
        Section 100 Row A — $200.00 each
      </li>
      <li data-bdd="quick-pick-row" data-price-level-id="PL2" data-idx="1">
        Section 200 Row C — $100.00 each
      </li>
      <li data-bdd="quick-pick-row" data-price-level-id="PL2" data-idx="2">
        Section 100 Row B — $90.00 each
      </li>
      <li data-bdd="quick-pick-row" data-price-level-id="PL3" data-idx="3">
        Section 300 Row D — $1,500.00 each
      </li>
      <li data-bdd="quick-pick-row" data-price-level-id="PL3" data-idx="4">
        Section 200 Row A — $40.00 each
      </li>
    </ul>

    <section data-bdd="order-summary">Subtotal $0.00</section>

    <!--
      The quantity selector and add-to-cart button are present so the
      F2.6 [dom.selector-registry-resolves] assertion can prove the
      registry resolves the names ``quantity_select`` and
      ``add_to_cart_button`` against a realistic event-page fixture.
      Real Ticketmaster pages render these widgets next to the
      quick-picks list; we keep them in the same fixture so existing
      strategy tests that load ``quick_picks_basic.html`` are unaffected
      (the click recorder above only fires on rows).
    -->
    <select data-bdd="quantity-select" name="quantity" aria-label="Ticket quantity">
      <option value="1">1</option>
      <option value="2" selected>2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
    <button type="button" data-bdd="checkout-button">Add to Cart</button>
  </main>

  <script>
    // Click recorder so tests can assert "row N was clicked exactly once".
    window.__clicks = [];
    document.addEventListener('click', function (event) {
      var row = event.target.closest('[data-bdd="quick-pick-row"]');
      if (!row) return;
      var idx = row.getAttribute('data-idx');
      window.__clicks.push(idx);
      var prev = parseInt(row.getAttribute('data-click-count') || '0', 10);
      row.setAttribute('data-click-count', String(prev + 1));
    }, true);
  </script>
</body>
</html>
