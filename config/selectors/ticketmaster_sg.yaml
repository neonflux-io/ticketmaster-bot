# Logical-name -> CSS selector fallbacks for the **ticketmaster.sg**
# (Singapore) vendor adapter. Drafted from F7.1 recon against the live
# site on 2026-05-20; locked in by F7.2.
#
# Important: ticketmaster.sg runs a Yii/Bootstrap stack that is entirely
# distinct from the React app at ticketmaster.com. **Do not reuse the
# US ticketmaster.yaml selectors here** - ``data-bdd=`` attributes do
# not exist on the SG site. The selectors below map straight to the
# real ids, names, and CSS classes observed in:
#   docs/recon/ticketmaster_sg/{01_home,02_event_detail,03_seat_selection,
#                              04_captcha,05_login}.html
# and the distilled fixtures under
#   tests/fixtures/vendors/ticketmaster_sg/*.html
#
# Each list under a name is tried in order by
# ``src.registry.selectors.locator(page, name)`` (joined with ", ").

# ----- event detail page (/activity/detail/<gameCode>) ---------------------

# Each row in the schedule table that lists the available event dates.
# ``data-key`` is the numeric event/area id used in subsequent URLs.
event_date_row:
  - "table.auto-game-list tbody tr[data-key]"
  - "tr[id^='26sg_'][data-key]"
  - "tr[id^='27sg_'][data-key]"

# The "Find tickets" anchor inside an event-date row. ``href`` points to
# /ticket/area/<gameCode>/<dateId>.
event_find_tickets_link:
  - "table.auto-game-list tbody tr a.btn-primary"
  - "tr[data-key] a[href*='/ticket/area/']"

# Alternative date <select> shown on smaller viewports.
event_date_select:
  - "select#date-list"
  - "select[name='dateList']"

# ----- ticket-area page (/ticket/area/<gameCode>/<dateId>) -----------------

# Top-of-page date/event <select>. The bot reads its value, the user can
# also change it to pick a different show.
#
# The 2026 live capture (docs/recon/ticketmaster_sg/f7_4_capture/
# 02_ticket_area.html line 396) renders this as
# ``<select id="gameId" name="gameId">`` — flat names, NOT the Yii-style
# ``Game[gameId]`` the F7.1 recon documented. Both are listed so a
# stale (pre-2026) render is still matched.
ticket_area_event_select:
  - "select#gameId"
  - "select[name='gameId']"
  - "select#Game_gameId"
  - "select[name='Game[gameId]']"

# Quantity <select> on the area page (1..max-per-customer).
#
# F7.1 recon documented this as ``select#TicketForm_count`` but the
# live 2026 DOM (captured under docs/recon/ticketmaster_sg/f7_4_capture/
# 02_ticket_area.html) shows that select is per-ticket-type, lives
# inside the AJAX-injected ``#priceList`` form, and is named
# ``TicketForm[ticketPrice][<rowId>]`` (id ``TicketForm_ticketPrice_<rowId>``).
# The fallbacks below match the live DOM; the row-id is whatever the
# server emits (e.g. ``005``).
ticket_area_quantity_select:
  - "select[name^='TicketForm[ticketPrice]']"
  - "select[id^='TicketForm_ticketPrice_']"
  - "table#ticketPriceList tbody tr select"

# "Best Available" submit button on the area page.
ticket_area_best_available_button:
  - "button#autoMode"
  - "button.btn-primary:has-text('Best Available')"

# Container that the area-map AJAX (``/ticket/get-area-map``) populates.
ticket_area_map_container:
  - "div#mapContainer"

# Clickable section group inside the area-map SVG. ``id`` is the
# sectionCode (e.g. ``field_GA_A``); the matching record in the inline
# ``zone`` JSON carries the section-specific check-captcha URL.
ticket_area_section_group:
  - "div#mapContainer svg g#sections > g[id]"

# Section list rendered by ``/ticket/get-area-list`` (text-only fallback
# when SVG fails to load).
ticket_area_section_link:
  - "div.area_list a[id]"
  - "div.area_select ul.zone-list li a"

# Selected-area indicator that appears once a section is chosen.
ticket_area_selected_section_label:
  - "div#selectedArea strong"
  - "span#groupName"

# ----- ticket-type chooser (AJAX inside #priceList) ------------------------

# Each ticket type row (Standard / VIP / etc.).
ticket_type_row:
  - "table#ticketPriceList tbody tr[id^='pt-']"

# Visible price text inside a ticket-type row. Sample values seen on the
# live site: "$144.00" (SGD - the site uses the bare $ sign).
ticket_type_price_text:
  - "table#ticketPriceList tbody tr[id^='pt-'] td:nth-of-type(2)"

# Visible ticket-type name (e.g. "Standard").
ticket_type_name_text:
  - "table#ticketPriceList tbody tr[id^='pt-'] td.ticketpricetext"

# Per-ticket-type quantity <select>. The id suffix matches the row id
# (``pt-005`` -> ``TicketForm_ticketPrice_005``).
ticket_type_quantity_select:
  - "select[id^='TicketForm_ticketPrice_']"
  - "select[name^='TicketForm[ticketPrice]']"

# Hidden companion that carries the weight/multiplier for that row.
ticket_type_price_size_input:
  - "input[type='hidden'][id^='TicketForm_priceSize_']"
  - "input[type='hidden'][name^='TicketForm[priceSize]']"

# Submit button inside ``#form-ticket-ticket`` ("Best Available").
ticket_form_submit_button:
  - "button#autoMode"
  - "form#form-ticket-ticket button:has-text('Best Available')"

# Optional "Pick Your Own Seat" button - only rendered for venues that
# opt into the Fancybox seat-map. Clicking it opens
# ``/ticket/select-seat/<gameCode>/<dateId>/<count>/<qty>`` in a Fancybox
# iframe.
ticket_form_manual_seat_button:
  - "button#manualMode"

# Hidden CSRF token on every Yii form on the SG site.
csrf_input:
  - "input[type='hidden'][name='_csrf']"

# ----- interactive seat-map (/ticket/select-seat/...) ----------------------

# F8.1 recon: ticketmaster.sg renders the per-section seat-map as a
# server-rendered <table class="seat"> mounted inside a Fancybox iframe
# (NOT SVG, NOT Canvas). Each seat is a <td> with class={empty|sold|
# noseat|checked|tagseat} and the per-cell data-attributes
# data-coordinate (internal grid index, e.g. "5_3"),
# data-seatrow (visible row label, e.g. "18"), and
# data-seatno (visible seat label, e.g. "5"). The strategy matches
# against the visible labels (data-seatrow / data-seatno), NOT the
# internal coordinate, because the user picks "Row 18 seat 5".
#
# The iframe lives on /ticket/select-seat/<gameCode>/<dateId>/<areaNo>/<count>;
# the parent page URL stays on /ticket/area/<...> while the iframe
# loads. See docs/recon/ticketmaster_sg/seatmap.md for the full DOM
# walk-through.

# The Fancybox iframe wrapper that holds the seat-map. Used by the
# SG seat-map strategy to descend into the frame via
# page.frame_locator(...) before resolving cell-level selectors.
seatmap_iframe:
  - "iframe[src*='/ticket/select-seat/']"
  - "iframe[src*='ticket/select-seat']"

# The seat-grid <table>. Used as a "seat-map fully rendered" marker
# (count() > 0) and as a scope for the per-cell selectors.
seatmap_grid:
  - "table.seat"

# Header / legend / section-label markers. Mostly used by tests +
# operators to confirm the iframe really loaded the seat-map (rather
# than a 401 / error page).
seatmap_section_label:
  - "div.area-name"

seatmap_legend:
  - "ul#legend"

# Per-cell selectors, broken out by visible state so the strategy can
# (a) count available seats up-front, (b) skip aisle / sold / already-
# selected cells when picking, and (c) confirm post-click that the
# cell flipped from .empty to .checked.
seatmap_seat_available:
  - "table.seat td.empty[data-seatrow][data-seatno]"

seatmap_seat_sold:
  - "table.seat td.sold"
  - "table.seat td.tagseat"

seatmap_seat_selected:
  - "table.seat td.checked"

seatmap_seat_noseat:
  - "table.seat td.noseat"

# Parametric template: matches a specific available seat by its
# visible row/seat label. Rendered by src.vendors.ticketmaster_sg.
# selectors.selector_for_template, which CSS-escapes both placeholders
# before substitution. The strategy passes
# row=tickets.interactive_seatmap.row,
# seat=tickets.interactive_seatmap.seat from the operator's config.
seatmap_seat_by_label_template:
  - "table.seat td.empty[data-seatrow=\"{row}\"][data-seatno=\"{seat}\"]"

# Action buttons inside the iframe. submitSeat is the "Confirm Seats"
# button the strategy clicks after the cell flip, which triggers the
# inline AJAX POST to /ticket/select-seat/<...> and (on success) the
# Fancybox close + parent-form submit that advances to the captcha
# gate at /ticket/check-captcha/<...>.
seatmap_submit_button:
  - "button#submitSeat"

seatmap_close_button:
  - "button#exitSeat"

seatmap_reset_button:
  - "button#resetSeat"

# ----- check-captcha page (/ticket/check-captcha/...) ----------------------

check_captcha_form:
  - "form#form-ticket-check-captcha"

# Yii image-CAPTCHA <img>. The ``src`` is /ticket/captcha?v=<token>.
# Clicking the image refreshes it via /ticket/captcha?refresh=1.
captcha_image:
  - "img#TicketForm_verifyCode-image"

# Text input for the alpha-only verification code.
captcha_input:
  - "input#TicketForm_verifyCode"
  - "input[name='TicketForm[verifyCode]']"

# Required terms checkbox. Submission is blocked by inline jQuery if
# unticked, with a client-side ``alert()``.
captcha_terms_checkbox:
  - "input#TicketForm_agree"
  - "input[type='checkbox'][name='TicketForm[agree]']"

# Submit button (no id; only "Submit" text). Scope to the form so we
# don't grab a footer button by accident.
captcha_submit_button:
  - "form#form-ticket-check-captcha button[type='submit']"
  - "form#form-ticket-check-captcha button:has-text('Submit')"

# Hidden field that Google's invisible reCAPTCHA Enterprise widget fills
# in just before the form is posted.
recaptcha_response_input:
  - "input#g-recaptcha-response"
  - "input[name='g-recaptcha-response']"

# Frames whose presence proves the SG site has thrown a captcha at us
# (regardless of whether the user has touched it yet).
captcha_iframe:
  - "iframe[title='reCAPTCHA']"
  - "iframe[src*='recaptcha/enterprise']"
  - "iframe[src*='recaptcha/api2/anchor']"

# ----- login page (auth.ticketmaster.com OAuth) ----------------------------

login_email_input:
  - "input#email-input"
  - "input[name='email']"

login_continue_button:
  - "button[name='sign-in']"
  - "form button[type='submit']"

login_passkey_button:
  - "button:has-text('Sign In With A Passkey')"

# Hidden NuData / NuDetect device-fingerprint payload posted alongside
# the credentials. Useful as a "page is fully booted" marker.
login_nds_pmd_input:
  - "input[type='hidden'][name='nds-pmd']"

# ----- queue (Queue-It) ----------------------------------------------------

# ticketmaster.sg fronts every page with the Queue-It JS interceptor
# (customer id ``ticketmasterasia``, NOT ``ticketmastersg``). When a
# queue is active, the user is hard-redirected to the queue-it.net
# subdomain - we detect it by URL.

queue_redirect_url_substrings:
  - "queue-it.net"
  - "ticketmasterasia.queue-it.net"

# Queue-It in-line UI fragments that survive on the SG host while
# waiting (rare; only on light queues).
queue_position_text:
  - "text=/your place in line/i"
  - "text=/people ahead of you/i"
  - "[class*='queue-position']"

# ----- cart page (/ticket/checkout/<gameCode>/<dateId>/<areaNo>/<qty>) ----

# The cart page is the same SG Yii/Bootstrap stack as the rest of the
# site; the user lands here after the captcha + login dance. Selectors
# below were sourced from the F7.4 hand-built cart.html fixture, which
# in turn mirrors recon-verified ids/classes from the live ticket-area
# and check-captcha pages (see docs/recon/ticketmaster_sg.md and the
# banner-comment in tests/fixtures/vendors/ticketmaster_sg/cart.html).

# Quantity dropdown on the cart / pre-cart ticket-area page.
#
# The SG site renders the quantity selector inside the AJAX-injected
# ``#priceList`` form (table ``#ticketPriceList``), one ``<select>`` per
# ticket-type row, named ``TicketForm[ticketPrice][<rowId>]`` (id
# ``TicketForm_ticketPrice_<rowId>``). Matches the live DOM at
# docs/recon/ticketmaster_sg/f7_4_capture/02_ticket_area.html.
cart_quantity_select:
  - "select[name^='TicketForm[ticketPrice]']"
  - "select[id^='TicketForm_ticketPrice_']"
  - "table#ticketPriceList tbody tr select"

# Terms-of-purchase checkbox. The SG site reuses input#TicketForm_agree
# (the same id seen on /ticket/check-captcha/).
cart_terms_checkbox:
  - "input#TicketForm_agree"
  - "input[type='checkbox'][name='TicketForm[agree]']"
  - "input[type='checkbox'][name='CheckoutForm[agree]']"

# Marketing opt-in checkboxes the cart accept_terms helper MUST avoid.
cart_marketing_opt_in:
  - "input#TicketForm_marketingOptIn"
  - "input#CheckoutForm_marketingOptIn"
  - "input[type='checkbox'][name*='marketingOptIn']"

# "Add to Cart" / "Best Available" submit button on the cart page.
# Reuses button#autoMode (the same id observed on the live ticket-area
# Best Available control).
cart_add_to_cart_button:
  - "button#autoMode"
  - "form#form-ticket-cart button[type='submit']"

# URL substrings that prove the browser has transitioned to the SG cart
# / order-summary page (consumed by verify_cart_in_cart).
cart_url_markers:
  - "/ticket/checkout/"
  - "/cart"

# DOM markers (page-level) that prove the cart page itself rendered.
# Used as a fallback when the URL alone is ambiguous. The live SG
# capture (F7.6) shows the cart-equivalent page is the combined
# ``/ticket/checkout`` URL whose form id is ``form-ticket-checkout``,
# whose order-summary table id is ``cartList``, and whose ticket-count
# span id is ``cartTotalTicket`` — those are the structural ids the
# Yii template emits even when the SG site is logged out / paused /
# captcha-gated, so they're the canonical cart-page indicators.
cart_page_indicators:
  - "form#form-ticket-checkout"
  - "table#cartList"
  - "span#cartTotalTicket"
  - "section#sec-cart"
  - "table#cartTable"
  - "form#form-ticket-cart"
  - "div#cartSummary"

# Order summary / cart total node — read by verify_cart_matches.
# The live SG ``/ticket/checkout`` page exposes the order total via
# ``span#orderAmount`` (e.g. ``$600.00``) — that's the canonical SGD
# total used by the SG cart-match verifier. Legacy / US-style ids are
# kept as later fallbacks.
cart_order_total:
  - "span#orderAmount"
  - "#cartOrderTotal"
  - "#checkoutOrderTotal"
  - ".cart-total"
  - "td.cart-total"

# Canonical ticket-count node on the SG ``/ticket/checkout`` page —
# ``<span id="cartTotalTicket">N ticket(s)</span>``. Read by
# ``verify_cart_matches`` BEFORE the broader text-regex fallback so
# anti-scrape order tokens (the hex ``<span class="hex_Order_number">``
# adjacent to the column headers) and section-number runs
# (``GENERAL ADMISSION FREE SEATING EXCL. 230-232``) cannot poison
# the count.
cart_ticket_count_node:
  - "span#cartTotalTicket"

# Per-row section/zone label nodes inside the SG cart table. The live
# ``/ticket/checkout`` page renders each cart row's
# section/ticket-type combo inside ``<div class="ticket-info">`` —
# the first line is the group/zone label ("GEN ADM"), the second is
# the ticket-type ("Standard $144.00"). ``verify_cart_matches`` reads
# the first line of each ``.ticket-info`` div as the section so the
# section-mismatch check works on the live SG DOM even though the
# page never prints the word "Section:".
cart_row_ticket_info:
  - "div.ticket-info"

cart_order_summary:
  - "table#cartList"
  - "form#form-ticket-checkout"
  - "div#orderSummary"
  - "section#sec-cart"
  - "div#cartSummary"

# ----- checkout page (delivery + payment) ----------------------------------

# Generic delivery <input type="radio"> control set.
checkout_delivery_radio:
  - "input.delivery-radio"
  - "input[type='radio'][name='CheckoutForm[deliveryMethod]']"
  - "div#deliveryFieldset input[type='radio']"

# Label-text template used to match a specific delivery option by its
# visible label (joined via :has-text). The "{keyword}" placeholder is
# rendered by src.registry.selectors.locator_template / selector_for_template.
checkout_delivery_option_label_template:
  - "label.form-check-label:has-text('{keyword}')"
  - "div.delivery-option label:has-text('{keyword}')"

# Live SG delivery selector. The 2026 capture (F7.6) shows the
# ``/ticket/checkout`` page uses a Yii ``<select>`` with id
# ``checkoutform-shipmentid`` whose ``<option>`` text labels are the
# visible delivery names (currently "Courier" and "Mobile Ticket" for
# this venue; other SG venues add "Venue Collection" etc.). When
# present, the SG select_delivery path chooses an option by visible
# text rather than ticking a radio.
checkout_delivery_select:
  - "select#checkoutform-shipmentid"
  - "select[name='CheckoutForm[shipmentId]']"

# Single payment radio rendered on the live SG ``/ticket/checkout``
# page (the SG site bundles every payment method - Visa, Mastercard,
# AMEX, Atome, GrabPay, Apple Pay, Google Pay, WeChat - behind one
# pre-checked ``checkoutform-paymentid-88`` radio). Used by the SG
# checkout module to confirm the payment-method block rendered.
checkout_payment_radio:
  - "input#checkoutform-paymentid-88"
  - "input[type='radio'][name='CheckoutForm[paymentId]']"

# Live SG ``/ticket/checkout`` Place Order / Checkout submit button.
# The 2026 capture renders this as a ``<button id="submitButton">``
# inside ``form#form-ticket-checkout`` with visible text "Checkout"
# — this IS the final-purchase trigger (despite living on the
# checkout page, the SG flow has no further confirmation step).
checkout_submit_button:
  - "button#submitButton"
  - "form#form-ticket-checkout button[type='submit']"
  - "button.btn-green:has-text('Checkout')"

# Generic saved-card radio (used as a fallback when last-four is None).
checkout_saved_card_radio:
  - "input.saved-card-radio"
  - "div.payment-option.saved-card input[type='radio']"

# Saved-card-by-last-four label template. The "{last_four}" placeholder
# is rendered by selector_for_template. Matches both the SG-canonical
# 'Visa ending in 4242' AND the alternative 'Mastercard **** 4242'.
checkout_saved_card_label_template:
  - "label.form-check-label:has-text('ending in {last_four}')"
  - "label.form-check-label:has-text('**** {last_four}')"
  - "input.saved-card-radio[data-last-four='{last_four}']"

# Place-Order / final submit button (only ever clicked when
# auto_purchase=true). The live SG ``/ticket/checkout`` page (F7.6
# capture) renders the final submit as ``button#submitButton`` with
# visible text "Checkout"; older / hand-built recon assumed the US
# naming so the legacy ids stay as later fallbacks.
checkout_place_order_button:
  - "button#submitButton"
  - "button#placeOrderButton"
  - "form#form-ticket-checkout button[type='submit']"
  - "button.btn-green:has-text('Checkout')"
  - "button:has-text('Place Order')"
  - "button:has-text('Confirm & Pay')"

# Order-confirmation page markers (used by _verify_order_placed).
checkout_order_confirmation:
  - "[data-page='confirmation']"
  - "h1:has-text('Order Confirmation')"
  - "div#orderConfirmation"

# ----- page-level state markers --------------------------------------------

# The SG navigator/state-detector uses these to classify a page when
# the URL alone is ambiguous.

sold_out_marker:
  - "text=/sold out/i"
  - "text=/no tickets are available/i"
  - "text=/SOLD OUT/i"

not_on_sale_marker:
  - "text=/sale starts/i"
  - "text=/on sale/i"
  - "text=/presale/i"

# Anything that proves we're past the captcha gate and inside the
# real seat-selection flow.
seat_selection_loaded_markers:
  - "button#autoMode"
  - "div#mapContainer"
  - "form#form-ticket-ticket"

# Body-text scope used by auth/queue detectors.
page_body:
  - "body"

main_content:
  - "main"
  - "[role='main']"
